<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Error Handling</h2>

        <p>
            This Example Demonstates how to use <b>catch</b> to display an error.
        </p>

        <p id="error_message"></p>
        <script>
            try {
                adalert("Welcome Guest!");
            }
            catch(err) {
                document.getElementById("error_message").innerHTML = err.message;
            }
        </script>
    </body>
</html>
