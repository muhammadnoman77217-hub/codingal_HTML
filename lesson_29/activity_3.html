<!DOCTYPE html>
<html>
    <body>
        <p>Click the button the evaluate/execute JavaScript code/expressions</p>

        <button onclick="myFunction()">Try it</button>

        <p id="result"></p>

        <script>
            function myFunction() {
                var x = 10;
                var y = 20;

                var a = eval("x + y") + "<br>";
                var b = eval("x * y") + "<br>";
                var c = eval("x - y") + "<br>";

                var res = a + b + c; // concatenates the string

                document.getElementById("result").innerHTML = res;
            }
        </script>
    </body>
</html>
