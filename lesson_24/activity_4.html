<html>
    <body>
        <p> Sum of Arguments</p>
        <p id="result"></p>
        <script>
         function Sum() {
                var i;
                var Sum = 0;
                for (i = 0; i < arguments.length; i++) {
                    if (arguments[i] > Sum) {
                        Sum = arguments[i];
                    }
                }
                return Sum;
            }
            document.getElementById("result").innerHTML = (1 + 3);   
        </script>
    </body>
</html>
